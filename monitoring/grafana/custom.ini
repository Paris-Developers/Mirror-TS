; Grafana settings for the Mirror dashboard. Setup steps are in docs/MONITORING.md.
; Copy this file to C:\Program Files\GrafanaLabs\grafana\conf\custom.ini

[paths]
; the data source and dashboard are loaded from the repo, so a git pull updates the dashboard
provisioning = C:/Mirror-TS/monitoring/grafana/provisioning

[server]
http_port = 3000
; Grafana listens on every network adapter unless this is set. Set it to this PC's LAN address
; (the one the firewall rule in docs/MONITORING.md lets the viewing PC reach) to listen on that one only
;http_addr = <bot-pc-ip>

[auth.basic]
; refuses weak passwords (at least 12 characters, with an uppercase and a lowercase letter, a digit
; and a symbol), and takes the Skip button off the password prompt at the first sign-in
password_policy = true

[users]
allow_sign_up = false
allow_org_create = false

[auth.anonymous]
enabled = false

[security]
disable_gravatar = true
cookie_samesite = strict

[snapshots]
external_enabled = false

[analytics]
reporting_enabled = false
feedback_links_enabled = false

[news]
news_feed_enabled = false
